services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env.docker
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
